[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relicweave-synlab"
version = "0.1.0"
description = "A12 controllable synthetic fragment laboratory, large-scale pretraining and degradation diagnostics platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "opencv-python-headless>=4.10",
    "pillow>=10",
    "pyarrow>=17",
    # pinned below 3.0: pandas 3.x compiled extensions fail to initialise on this host
    "pandas>=2.2,<3",
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "trimesh>=4.4",
    "manifold3d>=3.0",
    "shapely>=2.0",
    "svgpathtools>=1.6",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "networkx>=3.3",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
# torch 2.14 fails to load its shm.dll on this host; 2.5.1+cpu verified working
train = ["torch==2.5.1"]
external = ["gmsh==4.15.2", "open3d==0.19.0", "pycolmap==3.11.1", "faiss-cpu==1.15.1"]
test = ["pytest>=8.2"]

[project.scripts]
synlab = "synlab.cli:main"

[tool.setuptools.packages.find]
include = ["synlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long running integration tests",
    "external: requires optional external backend (gmsh/open3d/pycolmap/bpy)",
]
