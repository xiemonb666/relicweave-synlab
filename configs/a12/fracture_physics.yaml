# =============================================================================================
# A12 fracture physics -- multi-piece, physically constrained fragmentation
# =============================================================================================
# New file (does NOT touch the frozen configs/a12/next_experiment.yaml).  Every block carries a
# `provenance:` line saying where its numbers come from.  Three classes are used, and they are
# NEVER mixed silently:
#
#   MEASURED         read at run time from the mother / material assets (no constant here)
#   LITERATURE       a published range, cited by name; the value chosen inside the range is
#                    flagged as an engineering choice
#   ENGINEERING      an assumption of this implementation; it is a calibration knob, not a
#                    measurement, and it is reported as such in every event meta
#
# The loader is `synlab.fracture.spec_physics.load_physics_config`; the same file is exposed
# through `synlab.cli validate` (see `generation_spec:` at the bottom).
# =============================================================================================

schema: synlab.fracture_physics.v1
units: mm
version: "1.0.0"

# ---------------------------------------------------------------------------------------------
# 1. Target piece count  N = N0 * (U/U_ref)^beta * (V/V_ref)^alpha * (t_ref/t)^gamma
# ---------------------------------------------------------------------------------------------
count_model:
  # reference/calibration body: declared, not fitted
  n0: 2.5047
  v_ref_mm3: 339292.0          # pi * 200 mm * 6 mm * 90 mm (bowl, D=200, t=6, H=90)
  thickness_ref_mm: 6.0
  v_impact_ref_mm_s: 3130.0    # 0.5 m free drop, v = sqrt(2 g h)
  # beta: exponent of the energy ratio.  Grady/Kipp dynamic-fragmentation scaling predicts a
  # fragment count that grows with the *strain rate*; over the low-velocity range relevant to
  # handling and dropping (0.5-5 m/s) a sub-linear exponent is used.
  #
  # CALIBRATED 2026-10-02 (measurement, not assumption).  Fitting ln N = ln N0 + beta*ln(U/U_ref) on
  # the thirteen measured points whose count is above the floor of two -- the V01 drop series at
  # 2000/4000/8000 mm for both materials (3/5/7 pieces each), the V13 pair at 2000 mm (5 pieces),
  # the V13 500 mm repeat (2 and 3 pieces) -- gives beta = 0.625 +- 0.035 (1 sigma), R^2 = 0.9675,
  # RMSE(ln N) = 0.075, mean |error| 0.26 pieces, worst 0.84.  The declared 0.65 is inside one
  # sigma of the measurement; the value shipped here is the measured 0.625 and the amplitude was
  # then re-solved on all 32 measured points with the floor treated as censored (N0 = 2.5047).
  # Full tables: configs/a12/fracture_calibration.json, docs/a12/fracture_calibration.md.
  impact_energy_exponent: 0.625
  # Weibull modulus m of the body material.  LITERATURE: fired earthenware / porous ceramic
  # bodies report m ~ 5-11 (Weibull weakest-link); the material profile's own value wins when
  # present, this is the fallback and is part of the calibration.
  weibull_modulus: 7.0
  # geometric (surface-area) part of the size effect: U_1 ~ V^(2/3) -> the 0.5
  weibull_volume_exponent: 0.5
  min_pieces: 2
  max_pieces: 64
  log_sigma: 0.18              # spread of the Weibull-distributed count around the mean
  provenance:
    n0: "CALIBRATED (measurement): amplitude re-solved on all 32 measured points with the floor of two pieces treated as censored (N0 = 2.5047, R^2 0.734 on the censored set, 19 of 32 points at the floor).  The previous declared value 3.0 came from calibrate_reference_energy, which *solved* the reference energy out of N0 and thereby left the amplitude degenerate: measured n_raw on the real V01 bowl (1.85e5 mm^3) was 0.61..1.73 at h<=500 mm, so the whole low-energy half of the calibration sat on the floor."
    impact_energy_exponent: "MEASURED 0.625 +- 0.035 on the thirteen unclamped points, R^2 0.9675; the previously declared 0.65 lies inside one sigma (the declared-exponent alternative and its residual table are in configs/a12/fracture_calibration.json)."
    weibull_modulus: "LITERATURE range 5-11 for fired earthenware; 7.0 chosen (ENGINEERING)"
    weibull_volume_exponent: "GEOMETRIC: fracture work of one shard ~ t^2, site count ~ V"
    min_pieces/max_pieces: "ENGINEERING validity window of the scaling law"
    alpha_size_exponent: "NOT fitted: alpha = 1/(2m) + 0.5 = 0.5714 is pinned to the declared Weibull + geometry form.  The measurements cannot separate it from the energy exponent with only three distinct unclamped counts, and the structural limit this creates (fixed drop height: N ~ V^(alpha-beta) = V^-0.054, i.e. bigger bodies give slightly FEWER pieces) is documented in docs/a12/fracture_calibration.md together with the measured counter-examples."

# ---------------------------------------------------------------------------------------------
# 2. Impact scenario (the energy that drives the count)
# ---------------------------------------------------------------------------------------------
impact:
  # drop height of a handled vessel (mm).  MEASURED scenario input, not a material constant.
  drop_height_mm: 500.0
  # if > 0 it overrides the drop height (mm/s)
  speed_mm_s: 0.0
  # 0 => use the physically computed count; >0 forces a count (efficiency sweep only, and the
  # physics result is still computed and recorded next to it)
  target_pieces_override: 0
  provenance:
    drop_height_mm: "ENGINEERING scenario (waist-height drop of a handled vessel)"
    target_pieces_override: "SWEEP ONLY: recorded as count_source=explicit_override"

# ---------------------------------------------------------------------------------------------
# 3. Material parameters
# ---------------------------------------------------------------------------------------------
material:
  # characteristic fracture energy (J/mm^2) per material id: 1e-3 J/mm^2 = 1000 J/m^2.
  # LITERATURE: dynamic fracture energy of porous ceramic bodies is of order 1e2-1e3 J/m^2.
  # The per-material spread below is an ENGINEERING ordering by porosity, not a measurement.
  fracture_energy_j_mm2:
    M01: 0.0010
    M04: 0.0016
    M06: 0.0012
    M07: 0.0008
    M09: 0.0011
    M10: 0.0009
    M11: 0.0013
  default_fracture_energy_j_mm2: 0.0010
  density_g_cm3_fallback: 2.2
  provenance:
    fracture_energy_j_mm2: "LITERATURE order of magnitude (1e2-1e3 J/m^2); per-material ordering ENGINEERING"
    density_g_cm3_fallback: "LITERATURE: fired earthenware 1.8-2.4 g/cm^3; MEASURED value wins"

# ---------------------------------------------------------------------------------------------
# 4. Seed density (which material gets more fracture sites)
# ---------------------------------------------------------------------------------------------
seeds:
  # w(p) = (t_ref/t(p))^a_t * (1 + k_curv*kappa(p)*scale^2)^a_c * exp(-d(p,impact)/lambda)
  thickness_exponent: 1.0      # thinner wall => more seeds (stress concentration, less shielding)
  curvature_gain: 1.0          # dimensionless curvature gain
  curvature_exponent: 0.5
  impact_decay_mm: 60.0        # exponential decay length of the impact proximity term
  impact_weight: 1.0           # 0 disables the proximity term
  min_weight_ratio: 0.05       # floor, so no admissible region gets a zero seed density
  jitter_mm: 0.35              # deterministic jitter of the stratified candidate grid
  max_candidates: 20000
  provenance:
    thickness_exponent: "ENGINEERING: thin wall = weaker section, more fracture sites"
    curvature_gain: "ENGINEERING: convex/high-curvature regions spall first"
    impact_decay_mm: "ENGINEERING: of the order of the vessel radius"
    max_candidates: "RESOURCE guard (candidate pool size), not physics"

# ---------------------------------------------------------------------------------------------
# 5. Secondary / tertiary crushing
# ---------------------------------------------------------------------------------------------
crushing:
  # probability that a piece larger than the trigger ratio is re-fractured
  secondary_probability: 0.85
  secondary_trigger_volume_ratio: 0.12   # piece volume / mother volume above which it re-breaks
  secondary_pieces_range: [2, 5]
  tertiary_probability: 0.35
  tertiary_pieces_range: [2, 3]
  max_generations: 3
  provenance:
    secondary_probability: "ENGINEERING; the frozen FractureConfig.secondary_probability is 0"
    secondary_trigger_volume_ratio: "ENGINEERING: 'large piece' threshold of the shard-size law"
    max_generations: "ENGINEERING: 3 = primary + secondary + tertiary, as requested"

# ---------------------------------------------------------------------------------------------
# 6. Fracture-surface roughness (physics-driven, deterministic -- never white noise)
# ---------------------------------------------------------------------------------------------
roughness:
  # amplitude is proportional to the shard's own wall thickness and to the material's grain size:
  #   a = clamp(amp_wall_ratio * t_wall, amp_min_mm, amp_max_mm)
  #   shortest wavelength = max(wavelength_grain_ratio * grain, wavelength_min_mm)
  # The surface is a finite Fourier sum with a 1/f^h spectrum over `n_bands` logarithmic bands,
  # deterministic in the shard's geometry hash -- NOT random noise: the wavelengths are tied to
  # the material grain size and the amplitudes to the measured wall thickness.
  amp_wall_ratio: 0.08          # amplitude / wall thickness
  amp_min_mm: 0.02
  amp_max_mm: 0.30
  wavelength_grain_ratio: 6.0   # shortest wavelength / grain size (the physical driver)
  # A visibility/resolvability floor.  The A06 interface gap is measured between two *linear*
  # triangulations of the same displaced surface, so their difference is the interpolation error
  # (1/8)|d''|*h^2.  Resolving a 0.6 mm feature inside a 0.3 mm amplitude band would need
  # h ~ 0.02 mm, i.e. billions of triangles.  The floor keeps the shortest admitted roughness
  # wavelength at 5 mm, which the facet lattice resolves with h = 1.25 mm, while the *physical*
  # driver (grain size) still sets the correlation length and every wavelength above the floor.
  # This is an ENGINEERING limit of the sampling scheme, and it is reported as such.
  wavelength_floor_mm: 5.0
  wavelength_min_mm: 0.20       # package guard WAVELENGTH_MIN_MM (spec.py)
  wavelength_max_mm: 3.00       # package guard WAVELENGTH_MAX_MM (spec.py)
  n_bands: 3
  # How a fracture facet is triangulated before it is displaced: "lattice" clips a SHARED lattice
  # to the facet (resolves the roughness), "fan" uses the facet corners only (cheapest, and the
  # only scheme whose cells are watertight by construction).  Measured in docs/a12/fracture_physics.md.
  facet_refinement: fan
  # Target sub-edge length in mm; 0 derives it as shortest_wavelength / edges_per_wavelength.
  facet_refine_mm: 0.0
  roughness_edges_per_wavelength: 0.75
  spectral_slope: 1.0           # amplitude ~ k^-slope (1 = "1/f" rough surface)
  correlation_factor: 2.0       # correlation length = factor * shortest wavelength (for the report)
  anisotropy: 0.35              # 0 = isotropic; >0 stretches the features along the facet trace
  provenance:
    amp_wall_ratio: "ENGINEERING: %-of-wall amplitude, matches the frozen AMP window 0.02-0.30 mm"
    wavelength_grain_ratio: "ENGINEERING: the material's own heterogeneity sets the shortest feature"
    wavelength_floor_mm: "ENGINEERING sampling limit: keeps the linear-triangulation error (A06 gap) inside budget"
    spectral_slope: "LITERATURE form: self-affine fracture surfaces have a power-law spectrum"
    anisotropy: "ENGINEERING: facet-parallel striations are the observed hackle/rib pattern"

# ---------------------------------------------------------------------------------------------
# 7. Precision budget (the A06 thresholds are NOT relaxed anywhere)
# ---------------------------------------------------------------------------------------------
tolerances:
  interface_gap_p95_mm: 0.02       # spec.py INTERFACE_GAP_P95_MM (frozen, not relaxed)
  normal_reversal_p95_deg: 2.0     # spec.py NORMAL_REVERSAL_P95_DEG
  volume_rel_tol: 1.0e-3           # spec.py VOLUME_REL_TOL
  overlap_ratio_max: 1.0e-4        # spec.py OVERLAP_RATIO_MAX
  ambiguity_area_ratio_max: 0.02   # spec.py AMBIGUITY_AREA_RATIO_MAX
  cell_merge_tol_mm: 1.0e-6        # convex-cell vertex merge (numerical, below any budget)
  facet_plane_tol_mm: 1.0e-5       # face-on-facet classification tolerance
  provenance:
    all: "copied from synlab/fracture/spec.py -- this file must never widen them"

# ---------------------------------------------------------------------------------------------
# 8. Resources / efficiency
# ---------------------------------------------------------------------------------------------
resources:
  max_pieces: 64
  max_total_faces: 900000
  boolean_backend: manifold3d
  parallelism: 1                  # single mother process (host kills heavy processes)
  provenance:
    all: "RESOURCE guards of this host (measured), not physics"

# ---------------------------------------------------------------------------------------------
# 9. GenerationSpec exposed to `synlab.cli validate`
# ---------------------------------------------------------------------------------------------
# `synlab.cli validate --config` type-checks a `synlab.v3` generation spec (pydantic,
# extra="forbid").  The block below is that spec, carried inside this file so the physics
# parameters and the validated generation spec are one artefact.  See
# docs/a12/fracture_physics.md 4.2 for the exact command and exit code.
generation_spec:
  schema: synlab.v3
  data_scope: SYNTHETIC
  release_profile: SANDBOX_CORE
  experiment_purpose: DEVELOPMENT
  master_seed: 20261002
  units: mm
  dataset:
    vessel_ids: [V01, V02, V13]
    material_ids: [M01, M04]
    pattern_ids: [PAT01]
    target_mothers: 3
  fracture:
    backend: warp_voronoi_cut
    target_piece_range: [2, 32]
    min_feature_wavelength_mm: 0.24
    shared_surface_max_error_mm: 0.01
    secondary_probability: 0.85
    rough_amplitude_mm: [0.02, 0.30]
    seed_count_range: [4, 32]
  resources:
    cpu_workers: 1
    threads_per_worker: 1
    cpu_rss_budget_gb: 8.0
    gpu_device: 0
    gpu_concurrency: 1
    gpu_budget_gb: 0.1
  storage:
    root: data/a12_fracphys
  notes: "multi-piece physically constrained fragmentation (warp_voronoi_cut)"

# ---------------------------------------------------------------------------------------------
# 10. Production backend selection (batch wiring)
# ---------------------------------------------------------------------------------------------
# The batch pipeline picks its fracture backend from the generation spec's
# `fracture.backend` field (see `synlab.pipeline.build_one_mother` ->
# `synlab.fracture.api.fracture_event`).  This block declares which of the implemented backends is
# the DEFAULT for production and which one stays as the baseline, so a run can switch backends by
# configuration alone and the switch is reviewable in one place.
#
#   * `warp_voronoi_cut`  -- multi-piece, physics-driven (count from size x toughness x energy).
#     It is the default below and it is what the `generation_spec:` block above carries, so
#     `synlab.cli validate --config configs/a12/fracture_physics.yaml` type-checks the exact spec
#     the default produces.
#   * `plane_shared_cut`  -- the frozen two-piece baseline; kept registered and selectable, and it
#     remains the backend of every other A12 config (`configs/a12/next_experiment.yaml` is frozen
#     and is NOT touched by this file).
#
# Measured acceptance for the default (docs/a12/fracture_calibration.md, section 6):
# 1 and 2 lineage batches on `data/a12_fcal/store`, whole DAG, real timings.
backends:
  default: warp_voronoi_cut
  baseline: plane_shared_cut
  implemented: [plane_shared_cut, rough_shared_cut, secondary_fracture, warp_voronoi_cut]
  available: [warp_voronoi_cut, plane_shared_cut, rough_shared_cut, secondary_fracture]
  switch_how: "set fracture.backend in the generation spec (or in this block's `default`); the pipeline reads the spec, never this block, at run time"
  provenance:
    default: "MEASURED: the calibration of this file (docs/a12/fracture_calibration.md) is fitted to warp_voronoi_cut events; the backend is the default for that reason, not by preference"
    baseline: "FROZEN baseline backend of the A12 campaign; never removed"




