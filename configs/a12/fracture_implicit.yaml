# =============================================================================================
# A12 fracture realism -- implicit-field (SDF sheet) fracture backend
# =============================================================================================
# New file.  It does NOT touch configs/a12/next_experiment.yaml, configs/a12/fracture_physics.yaml
# or configs/a12/fracture_morphology.yaml.  It declares the study configuration of the
# `implicit_sheet_cut` backend (synlab/fracture/implicit/) and the numbers every measurement in
# docs/a12/fracture_implicit.md was taken with.
#
# provenance classes, as in the other A12 configs -- never mixed silently:
#
#   MEASURED      read at run time from the mother / material asset (no constant here)
#   LITERATURE    a published relation or range, cited by name
#   ENGINEERING   an assumption of this implementation, flagged as a calibration knob
#
# ---------------------------------------------------------------------------------------------
# DEFAULT OFF (read before using this file)
# ---------------------------------------------------------------------------------------------
# The backend is registered in `synlab.registry` but is NOT in `synlab.fracture.api.BUILT_BACKENDS`
# and refuses to run unless it is switched on:
#
#   SYNLAB_FRACTURE_IMPLICIT=1        (environment), or
#   spec.meta["implicit"] = {...}     (per event), or spec.meta["implicit_backend"] = true
#
# So nothing that iterates the built backends changes behaviour, cost or QA numbers, and a caller
# that asks for the backend without switching it on gets a real refusal (never a plane cut
# labelled "implicit").
# =============================================================================================

schema: synlab.fracture_implicit.v1
units: mm
version: "1.0.0"

# ---------------------------------------------------------------------------------------------
# 1. Wiring / switch (default OFF)
# ---------------------------------------------------------------------------------------------
implicit:
  backend: implicit_sheet_cut                # synlab.fracture.implicit.BACKEND_IMPLICIT
  switch_env: SYNLAB_FRACTURE_IMPLICIT       # truthy: 1/true/yes/on/enabled
  switch_meta_keys: [implicit, implicit_backend]
  gated_by_default: true
  in_built_backends: false                   # api.BUILT_BACKENDS is unchanged on purpose
  registry_status: SPECIFIED
  entry_points:
    prepare: synlab.fracture.morphology.prepare_morphology
    field: synlab.fracture.implicit.field.build_implicit_field
    build: synlab.fracture.implicit.build_implicit_cutter
    run: synlab.fracture.implicit.run_implicit_event
    fallback: synlab.fracture.implicit.narrowband.build_narrowband_cutter
  provenance:
    all: "ENGINEERING: an explicit opt-in gate, chosen so that adding the module cannot move any existing number"

# ---------------------------------------------------------------------------------------------
# 2. The sheet construction (every number below is measured or declared, never assumed)
# ---------------------------------------------------------------------------------------------
sheet:
  # samples per shortest RETAINED wavelength in the sheet triangulation.
  # ENGINEERING: the task contract is >= 4-5; 5.0 is shipped.
  samples_per_wavelength: 5.0
  # hard guard on the sheet triangles.  When it binds, the footprint mask is widened and the relief
  # near the rim is damped -- the band-limiting and the widening are both reported.
  # ENGINEERING: memory/time guard for the boolean stage.
  max_sheet_triangles: 420000
  # coarse spacing of the flat part of the frame (outside the material band).
  # ENGINEERING: bounded by the dome's own curvature so the flat cells stay inside the budget.
  coarse_max_mm: 0.0                       # 0 = derive from the frame diagonal (diagonal / 24)
  # footprint mask transition width; 0 = derive (max(10 * delta, 1.4 mm)) and widen automatically
  # while the measured curvature does not fit the spacing the triangle budget allows.
  envelope_width_mm: 0.0
  # the two interpolation-budget knobs shared with the frozen cutter path (NOT relaxed here).
  error_budget_mm: 0.01                    # synlab.fracture.spec.DEFAULT_ERROR_BUDGET_MM
  strategy: tensor                         # conforming tensor-product sheet (no quadtree)

slope_calibration:
  # LITERATURE/ENGINEERING: a real ceramic fracture surface deviates from its mean plane by a few
  # degrees up to about 20 deg (P95).  The frozen morphology model asks for 53 deg, which the
  # calibration scales down; the constraint and both measurements are published per event.
  target_p95_deg: 18.0
  max_iterations: 4
  provenance: "LITERATURE (Mecholsky/Orr mirror-hackle work; A12 realism doc 9.4) + ENGINEERING margin"

# ---------------------------------------------------------------------------------------------
# 3. Study population (MEASURED -- ids only, geometry and material come from the assets)
# ---------------------------------------------------------------------------------------------
study:
  vessels: [V18]
  materials: [M01, M04, M07]               # coarse earthenware / porcelain / glass
  master_seed: 20261001
  lineage_id: a12_fracture_implicit
  mother_source: "data/a12_demo/demo_manifest.json -> synlab.mothers.api.create_mother(demo params, real material)"
  fixture_source: "tests/a12/fracture/fixtures.py (analytic box / thin bowl, used by the tests)"

# ---------------------------------------------------------------------------------------------
# 4. Evidence written by this backend's study (paths, not parameters)
# ---------------------------------------------------------------------------------------------
evidence:
  report: docs/a12/fracture_implicit.md
  measurements: data/a12_reports/implicit/measure_implicit.json
  renders: data/a12_reports/implicit/render_*.png
  store: data/a12_implicit/store

# ---------------------------------------------------------------------------------------------
# 5. Machine-checked block (`synlab.cli validate --config configs/a12/fracture_implicit.yaml`)
# ---------------------------------------------------------------------------------------------
# The nested generation spec is validated against synlab.schemas.spec.GenerationSpec.  Its
# FractureConfig.backend Literal contains `implicit_sheet_cut` (added together with this file, one
# line in synlab/schemas/spec.py), so the validated block can declare the real backend instead of a
# stand-in.  The backend stays gated off and out of BUILT_BACKENDS regardless.
generation_spec:
  schema: synlab.v3
  seed: 20261001
  dataset:
    target_mothers: 1
    splits: {train: 1.0}
  observation:
    renderer: software
  fracture:
    backend: implicit_sheet_cut
    target_piece_range: [2, 2]
    min_feature_wavelength_mm: 0.65
    shared_surface_max_error_mm: 0.01
    rough_amplitude_mm: [0.02, 0.3]
    seed_count_range: [2, 2]
  resources:
    cpu_threads: 4
    ram_gb: 8.0
    vram_gb: 0.0
    temp_disk_gb: 1.0
    persistent_disk_gb: 0.05
